server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /geochat {
    return 301 /geochat/;
  }

  # GeoChat runs behind the same-origin /geochat prefix. Its SPA is served by
  # port 5173, while API and SSE traffic must reach the backend on port 5050.
  location /geochat/api/ {
    proxy_pass http://host.docker.internal:5050/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # GeoChat's SPA is built with VITE_BASE_PATH=/geochat/ (docker/web.Dockerfile), so its
  # router and assets all live under the prefix. The proxy_pass here deliberately has NO
  # trailing slash: with one, nginx strips /geochat/ and the upstream router — whose base is
  # /geochat/ — sees a path it cannot match, and every deep link (e.g. /geochat/login) fell
  # back to the geochat home instead of the requested page.
  location /geochat/ {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Legacy passthrough: an organization.login_bg set to a root-absolute /login-bg.jpg in the
  # DB escapes the /geochat prefix. LoginView now ignores that legacy default (it serves a
  # BASE_URL-relative campus photo), so this only matters while old DB values exist.
  location = /login-bg.jpg {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
