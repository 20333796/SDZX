services:
  web:
    build:
      context: apps/web
      args:
        IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io/library/}
    ports:
      - "0.0.0.0:8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: apps/api
      args:
        IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io/library/}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://geology_ai:${POSTGRES_PASSWORD}@postgres:5432/geology_ai
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-knowledge-documents}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-roles}
      GEOCHAT_AUTH_BRIDGE_URL: ${GEOCHAT_AUTH_BRIDGE_URL:-http://host.docker.internal:5050}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX:-docker.io/library/}
    environment:
      APP_ENV: development
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://geology_ai:${POSTGRES_PASSWORD}@postgres:5432/geology_ai
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-knowledge-documents}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: ${PORTAL_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geology_ai}
      POSTGRES_USER: ${POSTGRES_USER:-geology_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geology_ai} -d ${POSTGRES_DB:-geology_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: ${PORTAL_REDIS_IMAGE:-redis:7-alpine}

  minio:
    image: ${PORTAL_MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${PORTAL_MINIO_API_PORT:-9100}:9000"
      - "${PORTAL_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
