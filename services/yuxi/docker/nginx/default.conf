server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    # 本容器只承载 GeoChat，构建时 VITE_BASE_PATH=/geochat/（见 docker/web.Dockerfile）。
    # 页面、静态资源与 API 全部约定在 /geochat 前缀内：
    #   /geochat/…      → SPA 页面与资源（dist 根目录，alias 去掉前缀映射）
    #   /geochat/api/…  → 后端 5050（剥掉 /geochat）
    # 直接访问根路径时 308 到 /geochat/，保持单一入口。

    location = /geochat {
        return 301 /geochat/;
    }

    location /geochat/api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # alias 让 /geochat/assets/x.js 命中 dist 根下的 assets/x.js；
    # SPA 路由回退到 /geochat/index.html（再次经过本 location 映射到 dist/index.html）。
    location /geochat/ {
        alias /usr/share/nginx/html/;
        try_files $uri /geochat/index.html;
    }

    location = / {
        return 308 /geochat/;
    }

    # 历史遗留：dist 根上的公共文件（login-bg.jpg 等）仍按根绝对路径提供，
    # 供 DB organization.login_bg 指向根绝对路径的旧配置使用。
    location / {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}
